services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payledger
      POSTGRES_PASSWORD: payledger
      POSTGRES_DB: payledger
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payledger -d payledger"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - payledger-pg:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: payledger
      DB_PASSWORD: payledger
      DB_NAME: payledger
      DB_SYNCHRONIZE: "true"
      SEED_DEMO: "true"
      THROTTLE_TTL_MS: 60000
      THROTTLE_SENSITIVE_LIMIT: 10
      CORS_ORIGIN: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  payledger-pg:
